  languages: [en, fi, sv]     # kaikki 24 Pronoian artikkelia ovat kaikilla kolmella
  source_lang_default: fi     # grandfathering; uudet artikkelit en
  legacy_ids:                 # jäädytetyt Pronoia-tunnisteet; numeroetuliite sallittu vain näissä
