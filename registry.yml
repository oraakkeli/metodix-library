# Metodix Library — registry.yml (M1-luonnos, 2.8.2026)
#
# Käsitekartta: yksi käsite, useita rekisterivariantteja, kussakin fi/en/sv.
# Tämä tiedosto on ihmisen ylläpitämä TOTUUS siitä, mitkä artikkelit ovat sama asia
# eri yleisölle. validate.py tarkistaa, että jokainen levyllä oleva artikkeli
# esiintyy täsmälleen kerran tässä ja että ristiviittaukset osoittavat olemassa oleviin.
#
# HUOM (M1:n löydös): rekisterien välinen suhde EI ole 1:1. Yksi fasilitoija-artikkeli
# voi vastata useaa panelistiartikkelia (kysymystyypit). Siksi `registers` on
# rekisteri → LISTA tunnisteita, ei rekisteri → tunniste.
#
# Kaksi eri kenttää, joita ei saa sekoittaa:
#   public_target (käsitetaso) = ansaitseeko TÄMÄ KÄSITE julkisen artikkelin?
#                                true | split (vaatii oman julkisen version) | false
#   articles.<id>.public (artikkelitaso) = saako TÄMÄ TIEDOSTO näkyä julkisella sivulla?
# Molemmat noudattavat päätettyä sääntöä:
#   "Onko se ymmärrettävä ja hyödyllinen ihmiselle, jolla ei ole Pronoiaa?"
#
# M6:n mittaustulos (2.8.2026): kaikissa 13 fasilitoija-artikkelissa on
# tuotesidonnaisia viittauksia → yksikään ei mene julkiseksi sellaisenaan.
# Julkinen rekisteri kirjoitetaan omiksi artikkeleikseen (T7), ei republishaamalla.

